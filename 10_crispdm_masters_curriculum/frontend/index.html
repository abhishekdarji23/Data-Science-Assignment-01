<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>CRISP-DM Census Analytics</title>
  <style>
    body { font-family: sans-serif; max-width: 860px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 1.3rem; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 16px; }
    .tabs button { padding: 6px 10px; font-size: 0.82rem; cursor: pointer; border: 1px solid #ccc; background: #f4f4f4; }
    .tabs button.active { background: #1c2733; color: #fff; }
    section { display: none; }
    section.active { display: block; }
    pre { background: #f7f7f7; border: 1px solid #ddd; padding: 12px; overflow-x: auto; font-size: 0.82rem; }
    table { width: 100%; border-collapse: collapse; margin-top: 8px; font-size: 0.85rem; }
    th, td { text-align: left; border-bottom: 1px solid #ddd; padding: 4px 8px; }
    input, select, button.action { padding: 6px; margin-right: 6px; }
    .note { color: #666; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>CRISP-DM Census Analytics — Cosine LSH similarity search</h1>
  <div class="tabs" id="tabs"></div>

  <section id="content"><p class="note">Loading…</p></section>

  <script src="app.js"></script>
</body>
</html>
